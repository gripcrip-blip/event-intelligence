services:
  postgres:
    image: postgres:16-alpine
    container_name: event-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_intelligence
    ports:
      - "5433:5432"
    volumes:
      - event_intelligence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  event_intelligence_pgdata:
